<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart Blood Donor Finder</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #333; }
        header { background: #b30000; color: white; padding: 18px 6%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        header h1 { margin: 0; font-size: 24px; }
        nav { display: flex; gap: 16px; }
        nav a { color: white; font-weight: bold; text-decoration: none; }
        main { width: 90%; max-width: 760px; margin: 36px auto; }
        h2 { color: #b30000; margin-bottom: 24px; }
        .notification { background: white; border-left: 5px solid #b30000; border-radius: 8px; padding: 18px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.07); }
        .notification p { margin: 0 0 7px; font-weight: bold; }
        .notification span { color: #777; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>Notifications</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/settings">Settings</a>
        </nav>
    </header>
    <main>
        <h2>Recent Notifications</h2>
        {% for notification in notifications %}
        <article class="notification">
            <p>{{ notification.message }}</p>
            <div>{{ notification.details }}</div>
            <span>{{ notification.time }}</span>
        </article>
        {% else %}
        <article class="notification">
            <p>No new blood requests</p>
            <span>Notifications will appear here when a blood request is raised.</span>
        </article>
        {% endfor %}
    </main>
</body>
</html>
