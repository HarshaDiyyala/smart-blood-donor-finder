<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Blood Donor Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #b71c1c, #e53935);
        }
        
                .home-link {
                    display: block;
                    margin-top: 14px;
                    color: #555;
                    text-align: center;
                    font-size: 14px;
                    text-decoration: none;
                }
        
                .home-link:hover {
                    color: #c62828;
                }

                .server-message {
                    margin-bottom: 15px;
                    padding: 10px;
                    border-radius: 7px;
                    background: #ffebee;
                    color: #c62828;
                    text-align: center;
                    font-size: 14px;
                }

        .login-box {
            width: 390px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #b71c1c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e53935;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c62828;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register a {
            color: #c62828;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>🩸 Login</h1>
    <p class="subtitle">Smart Blood Donor Finder</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="server-message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/login" method="POST">
        <label for="email">Email or User ID</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email or User ID"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginBtn">Login</button>
    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="/register">Register as Donor</a>
    </div>

    <a class="home-link" href="/dashboard">Home</a>
</div>

</body>
</html>
