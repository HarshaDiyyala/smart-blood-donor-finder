<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Smart Blood Donor Finder</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            background: #f6f8fc;
            color: #172b4d;
            font-family: Arial, sans-serif;
        }
        .settings-page { max-width: 760px; margin: 0 auto; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }
        .topbar h1 { margin: 0; color: #b71c1c; font-size: 30px; }
        .topbar a { color: #b71c1c; font-weight: bold; text-decoration: none; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
        }
        .card h2 { margin: 0 0 6px; }
        .card p { margin: 0 0 24px; color: #667085; }
        .alert { padding: 12px 14px; border-radius: 7px; margin-bottom: 18px; }
        .alert-success { background: #e8f5e9; color: #2e7d32; }
        .alert-error { background: #ffebee; color: #c62828; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .full-width { grid-column: 1 / -1; }
        label { font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus, select:focus { outline: none; border-color: #c62828; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        button, .cancel {
            border: 0;
            border-radius: 6px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        button { background: #c62828; color: white; }
        button:hover { background: #a71919; }
        .cancel { background: #eef1f5; color: #344563; }
        @media (max-width: 600px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: auto; }
        }
    </style>
</head>
<body>
    <main class="settings-page">
        <div class="topbar">
            <h1>Account Settings</h1>
            <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
        </div>

        <section class="card">
            <h2>Edit profile</h2>
            <p>Keep your donor details up to date so requests can reach you.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('settings') }}">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full name *</label>
                        <input id="name" name="name" type="text" value="{{ profile.name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input id="email" name="email" type="email" value="{{ profile.email }}" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input id="phone" name="phone" type="tel" value="{{ profile.phone }}">
                    </div>

                    <div class="form-group">
                        <label for="blood_group">Blood group *</label>
                        <select id="blood_group" name="blood_group" required>
                            {% for group in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                                <option value="{{ group }}" {% if profile.blood_group == group %}selected{% endif %}>{{ group }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="location">Location *</label>
                        <input id="location" name="location" type="text" value="{{ profile.location }}" required>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Save changes</button>
                    <a class="cancel" href="{{ url_for('dashboard') }}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
